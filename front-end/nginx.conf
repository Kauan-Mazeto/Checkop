# Front-end do Checkop no Docker: o mesmo papel do proxy.conf.json do "ng serve".
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # o upload da análise de código aceita até ~9 MB
  client_max_body_size 12m;

  # ^~: /api/ sempre vai para o backend, antes das regras de cache abaixo
  location ^~ /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # IP real do usuário nos "Acessos recentes" (o backend confia em 1 proxy)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # análise de código (até 2,5 min) e correção com IA do arquivo inteiro (até 10 min)
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  # rotas do Angular (ex.: /dashboard, /scans/123) caem no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # arquivos com hash no nome podem ficar em cache; o index.html não
  location ~* \.(js|css|png|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
