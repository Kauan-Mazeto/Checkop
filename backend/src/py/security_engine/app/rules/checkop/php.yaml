# Regras do Checkop para PHP: lacunas do registro gratuito.
rules:
  - id: checkop-php-dynamic-include
    languages: [php]
    severity: ERROR
    message: >-
      include/require com um caminho vindo da requisição. O usuário escolhe qual arquivo é executado
      (LFI/RFI): mapeie o valor para uma lista fixa de páginas permitidas.
    patterns:
      - pattern-either:
          - pattern: include $X;
          - pattern: include_once $X;
          - pattern: require $X;
          - pattern: require_once $X;
          - pattern: include($X);
          - pattern: include_once($X);
          - pattern: require($X);
          - pattern: require_once($X);
      - metavariable-pattern:
          metavariable: $X
          pattern-either:
            - pattern: <... $_GET ...>
            - pattern: <... $_POST ...>
            - pattern: <... $_REQUEST ...>
            - pattern: <... $_COOKIE ...>
            - pattern: <... $_SERVER ...>
    metadata:
      cwe: ["CWE-98: Improper Control of Filename for Include/Require Statement in PHP Program"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: HIGH

  - id: checkop-php-weak-password-hash
    languages: [php]
    severity: WARNING
    message: >-
      md5()/sha1() aplicados a um dado da requisição (provavelmente senha). São rápidos e quebrados:
      use password_hash() e password_verify().
    patterns:
      - pattern-either:
          - pattern: md5($X)
          - pattern: sha1($X)
          - pattern: hash("md5", $X)
          - pattern: hash("sha1", $X)
      - metavariable-pattern:
          metavariable: $X
          pattern-either:
            - pattern: <... $_GET ...>
            - pattern: <... $_POST ...>
            - pattern: <... $_REQUEST ...>
            - pattern: <... $_COOKIE ...>
    metadata:
      cwe: ["CWE-916: Use of Password Hash With Insufficient Computational Effort"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      category: security
      confidence: MEDIUM

  - id: checkop-php-extract-request
    languages: [php]
    severity: ERROR
    message: extract() com dados da requisição sobrescreve variáveis do script (inclusive de autenticação).
    pattern-either:
      - pattern: extract($_GET, ...)
      - pattern: extract($_POST, ...)
      - pattern: extract($_REQUEST, ...)
      - pattern: extract($_COOKIE, ...)
    metadata:
      cwe: ["CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      category: security
      confidence: HIGH
